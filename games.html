<!DOCTYPE html>
<html>
<head>
<title>Math Homework Helper</title>
<style>
body {
    background-color: #1e1e1e;
     color: #d4d4d4;
    font-family: sans-serif;
     text-align: center;
margin-top: 30px;
    margin-bottom: 60px;
}

#cookie-btn {
    font-size: 90px;
     background: none;
    border: none;
     cursor: pointer;
transition: transform 0.1s;
}

#cookie-btn:active {
transform: scale(0.85);
}

.shop-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

.upgrade-btn {
     background-color: #2d2d2d;
    color: #4cd137;
     border: 1px solid #444;
    padding: 10px 20px;
     font-size: 14px;
    cursor: pointer;
     border-radius: 6px;
width: 280px;
}

.upgrade-btn:disabled {
    color: #666;
    border-color: #333;
    cursor: not-allowed;
}

#achievement-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #2f3640;
    color: #fbc531;
    border-top: 2px solid #fbc531;
    padding: 10px;
    font-weight: bold;
    font-size: 14px;
     text-align: center;
z-index: 1000;
}

#jumpscare-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #1e1e1e;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

#jumpscare-screen h1 {
    color: #ff4757;
    font-size: 40px;
    margin-bottom: 10px;
}

#jumpscare-screen p {
    color: #fff;
    font-size: 20px;
    margin-bottom: 30px;
}

#secret-boost-btn {
    position: fixed;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 12px;
    color: #444;
    cursor: pointer;
    transition: color 0.3s;
}

#secret-boost-btn:hover {
    color: #888;
}

.back-link {
    display: block;
     margin-top: 30px;
    color: #718093;
     font-size: 12px;
text-decoration: none;
}
</style>
</head>
<body>

<button id="secret-boost-btn">⚙️</button>

<div id="jumpscare-screen">
<h1>YOU ARE COMPLETELY COOKED.</h1>
<p>Get back to your Pomodoro timer right now!</p>
<button class="upgrade-btn" onclick="window.location.href='index.html'">Fine, Returning to Timer</button>
</div>

<h2>Very Productive Work</h2>

<h1 id="cookie-count">Cookies: 0</h1>
<p id="stats-display">Per Second: 0 | Per Click: 1</p>

<button id="cookie-btn">🍪</button>

<div class="shop-container">
<button id="buy-autoclicker" class="upgrade-btn">Cursor (Cost: 15)</button>
<button id="buy-grandma" class="upgrade-btn">Grandma (Cost: 100)</button>
<button id="buy-multiplier" class="upgrade-btn">Double Clicks (Cost: 50)</button>
</div>

<a href="index.html" class="back-link">Return to Pomodoro Timer (or press ESC)</a>

<div id="achievement-bar">Latest Achievement: None yet! Keep baking!</div>

<script>
let cookies = 0;
let clickPower = 1;
let autoClickers = 0;
let grandmas = 0;

let cursorCost = 15;
let grandmaCost = 100;
let multiplierCost = 50;

let achievements = {
    first100: false,
    first1000: false
};

let cookieDisplay = document.getElementById('cookie-count');
let statsDisplay = document.getElementById('stats-display');
let cookieBtn = document.getElementById('cookie-btn');
let cursorBtn = document.getElementById('buy-autoclicker');
let grandmaBtn = document.getElementById('buy-grandma');
let multiplierBtn = document.getElementById('buy-multiplier');
let achievementBar = document.getElementById('achievement-bar');
let jumpscareScreen = document.getElementById('jumpscare-screen');
let secretBoostBtn = document.getElementById('secret-boost-btn');

   cookieBtn.addEventListener('click', () => {
   cookies += clickPower;
      checkMilestones();
      updateUI();
});

 secretBoostBtn.addEventListener('click', () => {
    clickPower += 100;
    updateUI();
});

 cursorBtn.addEventListener('click', () => {
    if (cookies >= cursorCost) {
  cookies -= cursorCost;
     autoClickers++;
   cursorCost = Math.floor(cursorCost * 1.3);
       updateUI();
  }
});

 grandmaBtn.addEventListener('click', () => {
    if (cookies >= grandmaCost) {
  cookies -= grandmaCost;
     grandmas++;
   grandmaCost = Math.floor(grandmaCost * 1.4);
       updateUI();
  }
});

 multiplierBtn.addEventListener('click', () => {
    if (cookies >= multiplierCost) {
  cookies -= multiplierCost;
     clickPower *= 2;
   multiplierCost = Math.floor(multiplierCost * 2.5);
       updateUI();
  }
});

setInterval(() => {
     let totalCps = (autoClickers * 1) + (grandmas * 5);
     cookies += totalCps;
     checkMilestones();
   updateUI();
}, 1000);

function checkMilestones() {
    if (!achievements.first100 && cookies >= 100) {
        achievements.first100 = true;
        achievementBar.textContent = "🏆 Latest Achievement: 100 Cookies Baked!";
    }
    if (!achievements.first1000 && cookies >= 1000) {
        achievements.first1000 = true;
        achievementBar.textContent = "🏆 Latest Achievement: Cookie Master (1,000)!";
        jumpscareScreen.style.display = 'flex';
    }
}

function updateUI() {
    let cps = (autoClickers * 1) + (grandmas * 5);
    cookieDisplay.textContent = "Cookies: " + cookies;
       statsDisplay.textContent = "Per Second: " + cps + " | Per Click: " + clickPower;
cursorBtn.textContent = "Cursor (+1 CPS) - Cost: " + cursorCost;
grandmaBtn.textContent = "Grandma (+5 CPS) - Cost: " + grandmaCost;
multiplierBtn.textContent = "2x Clicks - Cost: " + multiplierCost;

cursorBtn.disabled = cookies < cursorCost;
grandmaBtn.disabled = cookies < grandmaCost;
multiplierBtn.disabled = cookies < multiplierCost;
}

window.addEventListener('keydown', (e) => {
    if (e.key === "Escape") {
        window.location.href = "index.html";
    }
});
</script>

</body>
</html>
