<!DOCTYPE html>
<html lang="en">
   <head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pomodoro</title>
   <link rel="stylesheet" href="styles.css">
</head>
   <body>
   <div class="container">
<h1>Pomodoro</h1>
     <p class="subtitle">Stay focused, one block at a time.</p>
  <div class="goal-box">
<input type="text" id="task-input" placeholder="What are you working on?">
     </div>
   <div class="timer-display">
      <span id="minutes">25</span>:<span id="seconds">00</span>
 </div>
       <div class="controls">
<button id="start-btn" class="btn primary">Start</button>
  <button id="pause-btn" class="btn">Pause</button>
     <button id="reset-btn" class="btn">Reset</button>
     <div class="counter">
   completed sessions Today: <span id="session-count">0</span>
           </div>
  </div>
  <div class="mode-selector">
    <button id="focus-btn">Focus (25m)</button>
    <button id="short-break-btn">Short Break (5m)</button>
    <button id="long-break-btn">Long Break (15m)</button>
</div>
     <script src="script.js"></script>
   </body>
</html>
